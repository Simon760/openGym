# openGym — single-container variant (see Dockerfile): serves the static app AND
# proxies /api to the Node API running beside it in the same container, so the
# whole app lives on ONE origin (required for WebAuthn / passkeys).
#
# The compose setup uses web/nginx.conf instead, which is this file pointed at
# the `api` service rather than at localhost. Keep the two in step.
#
# The listen port is rewritten to $PORT at startup by docker-entrypoint.sh —
# hosts like Render choose it and health-check that exact port.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API → the Node process in this same container. 127.0.0.1, not `api`: an
    # unresolvable upstream hostname makes nginx fail at config load, so pointing
    # this at a compose service name stops the container booting at all off-compose.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The MCP endpoint carries its token in the URL, so logging request paths would write
    # the credential to disk on every call. Nothing else about these requests is worth a line.
    location /api/mcp/ {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # App shell: always revalidate so updates show up immediately
    location ~* \.(js|css|json|html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Exercise images/GIFs never change → cache hard
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
}
